name: Upload Lambda Code & Trigger Infra

on:
  push:
    branches:
      - main
    paths:
      - "test/**"

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get changed Python files in test/
        id: changed_files
        run: |
          echo "CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- test/*.py)" >> $GITHUB_ENV
          echo "Changed files: $CHANGED_FILES"

      - name: Zip only changed scripts
        run: |
          mkdir -p zipped
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .py)
              zip "zipped/${filename}.zip" "$file"
            fi
          done

      - name: Upload ZIPs to S3
        run: |
          for zipfile in zipped/*.zip; do
            aws s3 cp "$zipfile" "s3://lambda-artifacts-ziad/lambda/$(basename $zipfile)"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Trigger Infra Repo Workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          repository: z1adAhmed/lambda_divison
          event-type: code-updated
          client-payload: '{"branch":"main"}'
