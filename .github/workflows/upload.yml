name: Upload Lambda & Deploy Terraform

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Comma-separated list of Python files to deploy (e.g., lambda1.py,lambda2.py)"
        required: true

jobs:
  pre_approval_summary:
    runs-on: ubuntu-latest
    outputs:
      changed_files: ${{ steps.prepare.outputs.changed_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare files list
        id: prepare
        run: |
          # Convert comma-separated input into space-separated list
          INPUT_FILES="${{ github.event.inputs.files }}"
          INPUT_FILES="${INPUT_FILES//,/ }"

          # Prefix with scripts/ if not already
          CHANGED_FILES=""
          for f in $INPUT_FILES; do
            if [[ "$f" != scripts/* ]]; then
              f="scripts/$f"
            fi
            CHANGED_FILES="$CHANGED_FILES $f"
          done

          CHANGED_FILES="${CHANGED_FILES## }"
          echo "CHANGED_FILES=$CHANGED_FILES"
          echo "::set-output name=changed_files::$CHANGED_FILES"

      - name: Pre-approval deployment summary
        run: |
          CHANGED_FILES="${{ steps.prepare.outputs.changed_files }}"
          echo "## 🛑 Production Deployment Approval Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** PROD" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📌 Deployment intent" >> $GITHUB_STEP_SUMMARY
          echo "The following Lambda functions WILL be updated if this deployment is approved:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for file in $CHANGED_FILES; do
            lambda_name=$(basename "$file" .py)
            echo "- \`$lambda_name\` (from \`$file\`)" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Approval impact" >> $GITHUB_STEP_SUMMARY
          echo "- Script files will be zipped" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts will be uploaded to S3" >> $GITHUB_STEP_SUMMARY
          echo "- Terraform will update Lambda code references" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**No changes have been applied yet.**" >> $GITHUB_STEP_SUMMARY

  deploy:
    runs-on: ubuntu-latest
    needs: pre_approval_summary
    environment:
      name: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare files to deploy
        id: changed_files
        run: |
          # Convert comma-separated input into space-separated list
          INPUT_FILES="${{ github.event.inputs.files }}"
          INPUT_FILES="${INPUT_FILES//,/ }"

          # Prefix with scripts/ if not already
          CHANGED_FILES=""
          for f in $INPUT_FILES; do
            if [[ "$f" != scripts/* ]]; then
              f="scripts/$f"
            fi
            CHANGED_FILES="$CHANGED_FILES $f"
          done

          # Trim leading space and save to environment
          CHANGED_FILES="${CHANGED_FILES## }"
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "Files to deploy: $CHANGED_FILES"

      - name: Zip input files
        run: |
          mkdir -p zipped
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .py)
              zip -j "zipped/${filename}.zip" "$file"
              echo "Zipped $file"
            else
              echo "File not found: $file"
            fi
          done

      - name: Upload ZIPs to S3
        run: |
          if compgen -G "zipped/*.zip" > /dev/null; then
            for zipfile in zipped/*.zip; do
              aws s3 cp "$zipfile" "s3://lambda-prod-artifacts-ziad/lambda/$(basename $zipfile)"
            done
          else
            echo "No ZIP files to upload."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: prod
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Terraform Apply
        working-directory: prod
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
