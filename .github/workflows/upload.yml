name: Upload Lambda & Deploy Terraform

on:
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to get full git history for diff

      - name: Fetch latest main branch
        run: git fetch origin main

      - name: Get changed Python files
        id: changed_files
        run: |
          # Compare current commit with main branch
          CHANGED_FILES=$(git diff --name-only origin/main HEAD -- 'scripts/*.py' || true)
          # Replace newlines with spaces for GitHub env
          CHANGED_FILES="${CHANGED_FILES//$'\n'/ }"
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV
          echo "Changed files: $CHANGED_FILES"

      - name: Zip changed scripts
        run: |
          mkdir -p zipped
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changed Python files to zip."
          else
            for file in $CHANGED_FILES; do
              if [ -f "$file" ]; then
                filename=$(basename "$file" .py)
                zip -j "zipped/${filename}.zip" "$file"
                echo "Zipped $file"
              fi
            done
          fi

      - name: Upload ZIPs to S3
        if: ${{ env.CHANGED_FILES != '' }}
        run: |
          for zipfile in zipped/*.zip; do
            aws s3 cp "$zipfile" "s3://lambda-prod-artifacts-ziad/lambda/$(basename $zipfile)"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        working-directory: prod
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Terraform Apply
        if: ${{ env.CHANGED_FILES != '' }}
        working-directory: prod
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
