name: Upload Lambda Code & Trigger Infra

on:
  push:
    branches:
      - main

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip Lambda code
        run: |
          zip lambda.zip lambda_function.py

      - name: Upload ZIP to S3
        run: |
          aws s3 cp lambda.zip s3://lambda-artifacts-ziad/lambda/lambda.zip
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Trigger Infra Repo Workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }} # triggers infra repo
          repository: z1adAhmed/lambda_divison
          event-type: code-updated
          client-payload: '{"branch":"main"}'
